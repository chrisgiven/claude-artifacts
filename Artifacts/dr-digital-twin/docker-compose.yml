# DR digital twin: two-site production replica inside an isolated network.
#
#   edge   (shared network "drtwin-edge"; lb also published on 127.0.0.1)  -> lb
#   bubble (internal: no route out, no route to prod)                       -> everything else
#
#   Site A (primary):  app-a1, app-a2, pg-a
#   Site B (DR):       app-b1 (warm standby), pg-b (streaming replica)
#   Shared:            backup -> vault volume
#
# No bind mounts: the console container drives this file through the host's
# Docker socket, where container-local paths would not resolve.
name: drtwin

x-db-env: &db-env
  POSTGRES_PASSWORD: twin-only-password
  POSTGRES_DB: orders

x-app: &app
  build: ./app
  image: ${DRTWIN_APP_IMAGE:-drtwin-app:latest}
  networks: [bubble]
  restart: "no"

x-db: &db
  build: ./db
  image: ${DRTWIN_DB_IMAGE:-drtwin-db:latest}
  networks: [bubble]
  restart: "no"

services:
  lb:
    <<: *app
    command: ["python", "lb.py"]
    environment:
      PRIMARY_POOL: app-a1:8000,app-a2:8000
      BACKUP_POOL: app-b1:8000
    ports: ["127.0.0.1:${TWIN_PORT:-8080}:8080"]
    networks: [edge, bubble]

  app-a1: &app-a
    <<: *app
    environment: &app-a-env
      SITE: A
      NODE: app-a1
      DB_DSN: host=pg-a,pg-b dbname=orders user=postgres password=twin-only-password target_session_attrs=read-write
  app-a2:
    <<: *app-a
    environment:
      <<: *app-a-env
      NODE: app-a2
  app-b1:
    <<: *app-a
    environment:
      <<: *app-a-env
      SITE: B
      NODE: app-b1
      DB_DSN: host=pg-b,pg-a dbname=orders user=postgres password=twin-only-password target_session_attrs=read-write

  pg-a:
    <<: *db
    environment: *db-env
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "max_replication_slots=5"]

  pg-b:
    <<: *db
    user: postgres
    environment:
      <<: *db-env
      PRIMARY_HOST: pg-a
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["replica-entrypoint.sh"]

  backup:
    <<: *db
    environment:
      <<: *db-env
      PGPASSWORD: twin-only-password
      DB_DSN: host=pg-a,pg-b dbname=orders user=postgres target_session_attrs=read-write
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-20}
    entrypoint: ["backup-loop.sh"]
    volumes: [vault:/vault]

networks:
  edge:
    name: drtwin-edge
    external: true
  bubble:
    internal: true

volumes:
  vault: {}
